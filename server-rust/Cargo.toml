[package]
name = "codesip-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hex = "0.4"
multer = "3"
percent-encoding = "2"
rand = "0.8"
rusqlite = { version = "0.43", features = ["bundled"] }
scrypt = { version = "0.12", default-features = false }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
